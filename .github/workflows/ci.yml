name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      external_links:
        description: Also request every external URL
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Consistency checks
        run: python3 scripts/check.py
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.24.0
      - name: Build release assets
        run: python3 scripts/build.py --package
      - name: Verify checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error

  external-links:
    if: github.event_name == 'workflow_dispatch' && inputs.external_links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Request external URLs
        run: python3 scripts/check.py --external
